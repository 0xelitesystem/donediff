[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "donediff"
version = "0.4.0"
description = "Audit what your coding agent claimed against what it actually did."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "RBL Industries" }]
keywords = ["ai-agents", "claude-code", "verification", "trust", "audit", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/0xelitesystem/donediff"
Issues = "https://github.com/0xelitesystem/donediff/issues"

[project.scripts]
donediff = "donediff.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
